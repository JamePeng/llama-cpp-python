name: Build Wheels (Metal)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_wheels:
    name: Build wheels (Metal macos-latest)
    runs-on: macos-latest

    env:
      MACOSX_DEPLOYMENT_TARGET: "13.3"

    outputs:
      version: ${{steps.get_version.outputs.version}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: 'pip'
          
      - name: Get Package Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(python .github/scripts/package_backend_wheel.py --version)
          VERSION=${VERSION#version=}
          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Configure macOS build
        shell: bash
        run: |
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$(sysctl -n hw.logicalcpu)" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1
        env:
          CIBW_REPAIR_WHEEL_COMMAND: ""
          CIBW_ARCHS: "arm64"
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_TEST_COMMAND: >-
            python -I -c "from pathlib import Path; import llama_cpp; from llama_cpp import _ggml;
            lib = Path(llama_cpp.__file__).resolve().parent / 'lib';
            assert (lib / 'libllama.dylib').is_file(), lib;
            _ggml.ggml_backend_load_all_from_path(str(lib).encode());
            assert _ggml.ggml_backend_reg_by_name(b'Metal'), 'Metal backend is missing';
            assert _ggml.ggml_backend_reg_by_name(b'RPC'), 'RPC backend is missing';
            print(llama_cpp.llama_print_system_info().decode())"
          CIBW_ENVIRONMENT: >
            MACOSX_DEPLOYMENT_TARGET=13.3
            CMAKE_BUILD_PARALLEL_LEVEL=$CMAKE_BUILD_PARALLEL_LEVEL
            CMAKE_ARGS="-DCMAKE_OSX_ARCHITECTURES=arm64
            -DCMAKE_APPLE_SILICON_PROCESSOR=arm64
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3
            -DCMAKE_BUILD_RPATH=@loader_path
            -DGGML_NATIVE=OFF
            -DLLAMA_BUILD_BORINGSSL=ON
            -DGGML_METAL=ON
            -DGGML_RPC=ON
            -DGGML_METAL_SHADER_DEBUG=OFF
            -DGGML_METAL_EMBED_LIBRARY=ON"
        with:
          package-dir: .
          output-dir: wheelhouse2

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: wheels-metal-arm64
          path: ./wheelhouse2/*.whl
          if-no-files-found: error

  release:
    name: Release
    needs: [build_wheels]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          path: dist2

      - name: Get Current Date # Step to get current date for the release tag
        id: get-date
        run: |
          # Get date in YYYYMMDD format using bash date command
          currentDate=$(date +%Y%m%d)
          # Store the date in environment variable for the release step
          echo "BUILD_DATE=$currentDate" >> $GITHUB_ENV

      - name: Publish Release via GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ needs.build_wheels.outputs.version }}-Metal-macos-$BUILD_DATE"

          echo "Ready to create release with tag: $TAG_NAME"

          gh release create "$TAG_NAME" dist2/* --title "$TAG_NAME" --generate-notes
